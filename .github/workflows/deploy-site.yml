name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-site.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp release version
        if: github.event_name == 'release'
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          perl -0pi -e 's{(<span data-version>)[^<]+(</span>)}{$1 . $ENV{RELEASE_VERSION} . $2}e; s{(style\.css\?v=)[^"]+}{$1 . $ENV{RELEASE_VERSION}}e' docs/index.html
          grep -q "<span data-version>${RELEASE_VERSION}</span>" docs/index.html
          grep -q "style.css?v=${RELEASE_VERSION}" docs/index.html

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync docs to server
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            docs/ "$SSH_USER@$SSH_HOST:$SSH_PATH"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
